name: Deploy (Cloudflare Pages)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        run: npm run build
        env:
          # Microsoft Clarity project id. Public by design (it is in the tag URL).
          # Unset means no analytics at all, which is the supported state for any
          # build that is not production.
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}

      # `functions/` travels with `dist/` because Wrangler picks Pages Functions
      # up from the working directory, not from the asset directory. Shipping it
      # in the artifact keeps the deploy job free of a checkout — see the note
      # on the publish step for why that matters.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            functions

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Unpacks to ./dist and ./functions, which is the layout `pages deploy`
      # expects: the asset directory named on the command line, and the
      # Functions directory beside it in the working directory.
      #
      # DO NOT add a checkout here. wrangler-action runs `npm i wrangler@3.90.0`
      # in this workspace, and wrangler 3 declares a peer dependency on
      # @cloudflare/workers-types@^4 while this repo is on ^5. With a
      # package.json present npm has to reconcile the two, fails ERESOLVE, and
      # the action dies before it reaches Cloudflare. An empty workspace has
      # nothing to reconcile.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .

      # wrangler-action, not pages-action: Cloudflare DELETED the pages-action
      # repository on 2026-09-18 with no notice, so every workflow pinned to it
      # fails at resolution before a step runs. GitHub reports that as "Unable to
      # resolve actions. Cannot access repositories 'cloudflare/pages-action'",
      # which reads like a permissions problem and is not one. Punchd, Long Rest
      # and DojoCompanion were moved the same week; this repo was the straggler.
      #
      # Not a rename: project name, directory and branch all move into the
      # wrangler command. The branch expression is kept exactly as it was — this
      # job also runs on pull requests, and the head ref is what makes those land
      # as Pages PREVIEW deployments rather than overwriting production. It is
      # quoted because a branch name may contain a slash.
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
            --branch="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}"
          # Optional; only creates the GitHub Deployments entries.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
